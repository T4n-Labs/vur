name: Generate VUR Index

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'extra/**'
      - 'multilib/**'
      - 'vtools/generate.sh'
      - '.github/workflows/index.yml'
  workflow_dispatch:

concurrency:
  group: vur-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x .github/workflows/generate.sh

      - name: Generate index
        run: ./.github/workflows/generate.sh

      - name: Commit index
        run: |
          git config user.name "VUR Bot"
          git config user.email "bot@vur.local"
          git add -A
          git diff --cached --quiet || git commit -m "update vur index"
          git push
